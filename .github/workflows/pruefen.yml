name: Prüfen
on: [push, pull_request]
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax aller Skripte
        run: for f in js/*.js *.js; do node --check "$f" || exit 1; done
      - name: Dateiliste und Build-Nummer
        run: node test/files.test.js
      - name: Track-Analyse mit künstlichem Track
        run: node test/analyse.test.js
